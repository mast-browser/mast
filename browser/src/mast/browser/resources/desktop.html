<!doctype html>
<html lang="en" class="{{HTML_CLASS}}">
<head>
<meta charset="utf-8">
<title>New Tab</title>
{{ICON}}
<style>{{STYLE}}
/* New tab: saved sites are a column of glass circles on the left edge, centred
   (design D, "circles only"): just the site's icon; its name shows in a pill to
   the right while hovered. They are a bookmarks folder. A long list wraps into a
   second column. */
body { background: var(--surface); }
.desk { display: grid; grid-template-columns: 1fr; gap: 48px; min-height: 100vh; padding: 40px 48px; }
.apps { position: fixed; z-index: 1; left: 24px; top: 50%; transform: translateY(-50%);
  display: flex; flex-flow: column wrap; align-content: flex-start; gap: 10px; max-height: calc(100vh - 120px); }
.app { position: relative; display: grid; place-items: center; flex: none; width: 36px; height: 36px; padding: 0;
  border: 1px solid rgb(255 255 255/.14); border-radius: 50%; background: rgb(255 255 255/.12);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: #ededed; text-decoration: none;
  transition: background-color .12s, border-color .12s; }
.app:hover, .app:focus-visible { background: rgb(255 255 255/.22); border-color: rgb(255 255 255/.28); }
.app:focus-visible { outline: 2px solid rgb(255 255 255/.5); outline-offset: 2px; }
/* .app .tile: the site's icon. Scoped: the blocklist panel has .tile cards too. */
.app .tile { display: grid; place-items: center; width: 20px; height: 20px; }
.app .tile img { width: 20px; height: 20px; border-radius: 4px; }
/* The name: a pill beside the circle while it's hovered or focused. */
.app .label { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
  display: none; align-items: center; height: 26px; padding: 0 10px; border: 1px solid rgb(255 255 255/.1); border-radius: 13px;
  background: rgb(10 10 10/.75); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  color: #ededed; font-size: 12px; font-weight: 500; white-space: nowrap; pointer-events: none; }
.app:hover .label, .app:focus-visible .label { display: flex; }
.apps.drag .app .label { display: none; }
.app .rm { position: absolute; top: -4px; right: -4px; display: none; place-items: center; width: 16px; height: 16px; padding: 0;
  border: 0; border-radius: 50%; background: var(--pressed); color: var(--text-2); box-shadow: 0 0 0 1px var(--line); }
.app:hover .rm, .app:focus-within .rm { display: grid; }
.app .rm:hover { color: var(--text); }
.app.dragging { opacity: .35; }
.app.drop-before::before { content: ''; position: absolute; left: 4px; right: 4px; top: -7px; height: 2px; border-radius: 1px; background: rgb(255 255 255/.7); }
.add { font: inherit; cursor: pointer; }
.add .tile { color: #ededed; }
.apps .hint { width: 220px; margin: 4px 0 0; color: var(--text-3); font-size: 12px; }
/* Customize, in the bottom-right corner. */
.customize { position: fixed; right: 48px; bottom: 24px; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
  border: 0; border-radius: var(--r); background: var(--field); color: var(--text-2); font-size: 12px; font-weight: 500; }
.customize:hover { background: var(--pressed); color: var(--text); }
/* Blocking lives in a dock at the bottom centre (design C20), flat on the
   desktop; its toast (Undo) appears just above it. Once everything is blocked
   the dock is only a status line with a countdown. */
.dock { position: fixed; left: 50%; bottom: 56px; z-index: 5; transform: translateX(-50%); display: flex; flex-direction: column;
  align-items: center; gap: 18px; width: 440px; max-width: calc(100vw - 32px); }
.widgets { display: flex; flex-direction: column; align-items: center; width: 100%; text-align: center; }
.widget { display: flex; flex-direction: column; align-items: center; }
.dist { gap: 16px; width: 100%; }
.dist .seg { display: flex; justify-content: center; gap: 24px; }
.dist .seg button { height: 36px; padding: 0; border: 0; background: none; color: var(--text-2); font-size: 15px; white-space: nowrap; }
.dist .seg button:hover { color: var(--text); }
.dist .seg button.on { color: var(--text); font-weight: 700; }
.dist .primary { height: 40px; padding: 0 26px; font-size: 14px; }
/* Block, centred, and the blocklist's settings button beside it (design C29a);
   a 40 px spacer on the other side keeps Block in the middle. */
.acts { display: flex; align-items: center; justify-content: center; gap: 10px; }
.acts .bal { width: 40px; flex: none; }
.gear { position: relative; display: grid; place-items: center; width: 40px; height: 40px; flex: none; padding: 0; border: 0; border-radius: 50%;
  background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); }
.gear:hover { background: var(--pressed); }
.gear::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); padding: 6px 10px;
  border-radius: 6px; background: rgb(20 20 20/.95); box-shadow: inset 0 0 0 1px rgb(255 255 255/.1); color: #f2f2f2; font-size: 12px; font-weight: 500;
  white-space: nowrap; text-shadow: none; pointer-events: none; opacity: 0; transition: opacity .12s; }
.gear:hover::after, .gear:focus-visible::after { opacity: 1; transition-delay: .3s; }
/* While something is blocked for a while: one quiet line, "Blocked until
   6:40 PM", and its countdown. No list of what; forever blocks aren't
   mentioned here at all (the blocklist shows them). */
.run { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 8px; outline: none; text-align: center; }
.run .line { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 20px; }
.run .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); flex: none; }
.run .nm { color: var(--text); font-size: 16px; font-weight: 600; white-space: nowrap; }
.run .left { color: var(--text-2); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dist .sep { width: 120px; height: 1px; background: var(--line); }
dialog { width: 340px; padding: 18px; border: 0; border-radius: 10px; background: var(--field); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: rgb(0 0 0/.35); }
/* The blocklist panel and Customize leave the page as it is: a dim stopped at the tab row,
   which the page can't reach. */
dialog.bl-panel::backdrop, dialog.cz::backdrop { background: transparent; }
dialog h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
#addDialog input { width: 100%; height: 34px; margin-bottom: 8px; padding: 0 10px; border: 0; border-radius: var(--r); outline: 0;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
#addDialog input:focus { box-shadow: inset 0 0 0 1px var(--text-3); }
dialog .err { min-height: 18px; color: var(--signal); font-size: 12px; }
#addDialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.toast { display: flex; align-items: center;
  gap: 14px; padding: 10px 10px 10px 16px; border-radius: 10px; background: var(--field); box-shadow: var(--shadow); white-space: nowrap; }
.toast.plain { padding-right: 16px; }
.toast button { height: 28px; padding: 0 12px; border: 0; border-radius: 4px; background: var(--pressed); font-weight: 500; }
.toast .secs { margin-left: 4px; color: var(--text-3); }
/* "Edit blocklist": the full list in a panel over the desktop. */
dialog.bl-panel { width: min(760px, 94vw); height: min(86vh, 920px); padding: 0; border-radius: 12px; overflow: auto;
  background: var(--surface); box-shadow: 0 24px 64px rgb(0 0 0/.6), 0 0 0 1px var(--line); --bl-bg: var(--surface); }
dialog.bl-panel .bl { padding: 32px 36px 0; }
dialog.bl-panel .bl header { padding-right: 44px; }
/* Opening the panel focuses its first button; no ring for that. */
.bl-close:focus { outline: none; }
.bl-close { position: sticky; top: 12px; float: right; z-index: 2; display: grid; place-items: center; width: 32px; height: 32px;
  margin: 12px 12px -44px 0; padding: 0; border: 0; border-radius: 50%; background: var(--field); color: var(--text-2); }
.bl-close:hover { background: var(--pressed); color: var(--text); }
/* Customize: a wallpaper in the clear style (no blur: a light wash keeps text
   legible, and widgets and tiles go dark), and the browser's palette. */
/* Customize's picture: its own layer, shown once decoded. Laid out like the
   tab row's copy (mast_wallpaper.cc). */
/* No fade: the browser paints the same picture behind this page from the
   first frame (mast_wallpaper.h, WallpaperBehindPage), so this copy just
   appears on top once decoded, and the page is never black. */
#wall { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-repeat: no-repeat;
  opacity: 0;
  background-image: linear-gradient(rgb(0 0 0/.22), rgb(0 0 0/.22)), var(--wall);
  background-size: 100% 100%, var(--wall-size, cover); background-position: 0 0, var(--wall-pos, center); }
/* The body must not paint over the layer; nor html, with a picture (served
   with class "picture"), so the browser's copy shows until ours is ready. */
body.wall { background: transparent; }
html.picture, html.picture body { background: transparent; }
#wall.shown { opacity: 1; }
body.light #wall { background-image: var(--wall); background-size: var(--wall-size, cover); background-position: var(--wall-pos, center); }
/* On a picture, icons lie flat on it (labels carry a tight shadow, as on a
   desktop), and widgets
   are translucent like the active tab's pill, so the picture comes through
   instead of black panels taking the stage. A light picture (Customize: Light)
   gets dark text and light glass. */
body.wall .widget, body.wall .customize { background: none; box-shadow: none;
  --text: #f2f2f2; --text-2: rgb(242 242 242/.82); --text-3: rgb(242 242 242/.62); --seg: rgb(0 0 0/.22); --pressed: rgb(255 255 255/.16);
  --field: rgb(255 255 255/.08); --line: rgb(255 255 255/.1); color: var(--text); text-shadow: 0 1px 6px rgb(0 0 0/.5); }
body.wall .widget .primary { text-shadow: none; }
body.wall .primary { background: #f2f2f2; color: #111; }
body.wall.light .primary { background: #141414; color: #f2f2f2; }
/* ...and stays visibly off when disabled (the rules above outrank .primary:disabled). */
body.wall .primary:disabled { background: rgb(255 255 255/.1); color: rgb(242 242 242/.4); }
body.wall.light .primary:disabled { background: rgb(0 0 0/.08); color: rgb(20 20 20/.4); }
body.wall .apps .hint { color: #ededed; text-shadow: 0 1px 2px rgb(0 0 0/.55); }
body.wall .customize:hover { background: rgb(255 255 255/.2); }
body.wall.light .widget, body.wall.light .customize { background: none; box-shadow: none;
  --text: #141414; --text-2: #3d3d3d; --text-3: #5e5e5e; --seg: rgb(0 0 0/.07); --pressed: rgb(255 255 255/.85); --field: rgb(0 0 0/.06);
  --line: rgb(0 0 0/.08); text-shadow: 0 1px 4px rgb(255 255 255/.55); }
body.wall.light .apps .hint { color: #141414; text-shadow: 0 1px 1px rgb(255 255 255/.45); }
body.wall.light .app { background: rgb(255 255 255/.4); border-color: rgb(0 0 0/.08); }
body.wall.light .app:hover, body.wall.light .app:focus-visible { background: rgb(255 255 255/.6); border-color: rgb(0 0 0/.12); }
body.wall.light .add .tile { color: #141414; }
body.wall.light .customize:hover { background: rgb(255 255 255/.7); }
.customize:focus:not(:focus-visible) { outline: none; }
.tone { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-bottom: 8px; padding: 2px; border-radius: var(--r); background: var(--surface); }
.tone button { height: 28px; border: 0; border-radius: 4px; background: none; color: var(--text-2); font-size: 12px; }
.tone button:hover { color: var(--text); }
.tone button.on { background: var(--pressed); color: var(--text); font-weight: 600; }
.cz .sub { margin: 0 0 20px; color: var(--text-3); font-size: 12px; }
dialog.cz { width: 400px; padding: 18px 20px 20px; }
.cz header { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px 14px 0; }
.cz header h3 { margin: 0; }
.cz h4 { margin: 0 0 10px; color: var(--text-2); font-size: 12px; font-weight: 600; }
.cz .x { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--text-2); }
.cz .x:hover { background: var(--pressed); color: var(--text); }
.cz .x:focus { outline: none; }
.bgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.bgs button { display: grid; place-items: center; aspect-ratio: 16 / 10; padding: 0; border: 0; border-radius: 8px; background: var(--surface) center/cover;
  box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); font-size: 12px; }
.bgs button:hover { color: var(--text); }
.bgs button.on { box-shadow: inset 0 0 0 2px var(--text); }
.bgs .up { background: none; box-shadow: inset 0 0 0 1px var(--text-3); }
.bgs .up:hover { box-shadow: inset 0 0 0 1px var(--text-2); }
.bgs .up[disabled] { cursor: default; opacity: .6; }
/* Built-in pictures (design C26): a row of thumbnails with names, then None and
   your own picture. */
.bgs.presets { margin-bottom: 8px; }
.bgs.presets button { display: flex; flex-direction: column; gap: 6px; aspect-ratio: auto; background: none; box-shadow: none; font-size: 11px; }
.bgs.presets button i { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 7px; background: var(--surface) center/cover; box-shadow: inset 0 0 0 1px var(--line); }
.bgs.presets button.on { box-shadow: none; color: var(--text); font-weight: 600; }
.bgs.presets button.on i { box-shadow: inset 0 0 0 2px var(--text); }
.bgs.own { grid-template-columns: repeat(3, 1fr); margin-bottom: 6px; }
.bgs.own button { aspect-ratio: auto; height: 34px; }
.credit { margin: 0 0 20px; color: var(--text-3); font-size: 11px; }
/* Tab bar on websites (design C23): each choice shows a tiny window on a light
   website, so the difference is visible before picking. */
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.bars button { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0; border: 0; background: none; color: var(--text-2); font-size: 12px; }
.bars button:hover { color: var(--text); }
.bars button.on { color: var(--text); font-weight: 600; }
.bars button[disabled] { opacity: .35; cursor: default; color: var(--text-2); }
.mini { position: relative; display: flex; flex-direction: column; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 7px; background: #f6f5f2; }
.mini::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
.bars button.on .mini::after { box-shadow: inset 0 0 0 2px var(--text); }
.mini .tb { display: flex; align-items: center; gap: 4px; height: 26%; padding: 0 6px; background: var(--b) center / cover; }
.mini .tb i { width: 14%; height: 3px; border-radius: 2px; background: rgb(255 255 255/.5); }
.mini .tb i:first-child { width: 30%; height: 60%; border-radius: 3px; background: rgb(255 255 255/.22); }
.mini.site .tb i { background: rgb(29 27 24/.4); }
.mini.site .tb i:first-child { background: rgb(29 27 24/.08); }
.mini .pg { display: flex; flex: 1; flex-direction: column; gap: 5px; padding: 9% 12%; }
.mini .pg i { width: 60%; height: 4px; border-radius: 2px; background: #c9c6bf; }
.mini .pg i:nth-child(2) { width: 85%; }
.mini .pg i:nth-child(3) { width: 45%; }
/* Match site (design C23d B): one window cut into three sites; each slice's tab
   bar runs straight into its own page. */
.mini.slices { flex-direction: row; }
.mini .sl { display: flex; flex: 1; flex-direction: column; min-width: 0; background: var(--b); }
.mini .sl .tb { padding: 0 4px; }
.mini .sl .pg { padding: 9% 14%; }
.mini .sl.lt .tb i { background: rgb(29 27 24/.4); }
.mini .sl.lt .tb i:first-child { background: rgb(29 27 24/.08); }
.mini .sl:not(.lt) .pg i { background: rgb(255 255 255/.22); }
.sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sw button { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 4px 0; border: 0; background: none; color: var(--text-2); font-size: 11px; }
.sw button:hover, .sw button.on { color: var(--text); }
.sw i { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(255 255 255/.12); }
.sw button.on i { box-shadow: inset 0 0 0 1px rgb(255 255 255/.12), 0 0 0 2px var(--field), 0 0 0 4px var(--text); }
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<main class="desk">
  <section class="apps" id="apps" aria-label="Saved sites"></section>
</main>
<div class="dock"><div id="toast" aria-live="polite"></div><aside class="widgets" id="widgets"></aside></div>
<dialog id="addDialog">
  <form method="dialog" id="addForm">
    <h3>Add a site</h3>
    <input id="addUrl" placeholder="Address, e.g. github.com" spellcheck="false" autocomplete="off" required>
    <input id="addName" placeholder="Name (optional)" spellcheck="false" autocomplete="off">
    <div class="err" id="addErr"></div>
    <div class="row"><button type="button" class="secondary" id="addCancel">Cancel</button><button class="primary" style="background:var(--text);color:var(--bg)">Add</button></div>
  </form>
</dialog>
<dialog id="blocklistDialog" class="bl-panel" aria-label="Blocklist">
  <button class="bl-close" id="blClose" aria-label="Close"><svg width="12" height="12" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.4"><path d="M2 2l6 6M8 2l-6 6"/></svg></button>
  <div id="blRoot"></div>
</dialog>
<button class="customize" id="customize"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5h6M12 4.5h1.5M2.5 11.5h1.5M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.75"/><circle cx="5.75" cy="11.5" r="1.75"/></svg>Customize</button>
<dialog id="czDialog" class="cz" aria-label="Customize">
  <header><h3>Customize</h3><button class="x" id="czClose" aria-label="Close"><svg width="12" height="12" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.4"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></header>
  <h4>Background</h4>
  <div class="bgs presets" id="czPresets"></div>
  <div class="bgs own" id="czBgs"></div>
  <p class="credit" id="czCredit"></p>
  <div id="czTone"></div>
  <div id="czBar"></div>
  <h4>Colors</h4>
  <div class="sw" id="czSw"></div>
  <input type="file" id="czFile" accept="image/*" hidden>
</dialog>
{{BLOCKLIST}}
<script>
const D = 864e5;
const DUR = [['1h', '1 h'], ['4h', '4 h'], ['today', 'Today'], ['week', 'Week'], ['month', 'Month'], ['forever', '∞']];
let state = null;
let dur = null;
let toastTimer = 0;
let dragId = null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hm = (t) => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
const day = (t) => new Date(t).toLocaleDateString([], {month: 'short', day: 'numeric'});
const midnight = () => { const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); };
function untilText(u) {
  if (u === null) return 'forever';
  if (u === midnight()) return 'until midnight';
  if (new Date(u).toDateString() === new Date().toDateString()) return 'until ' + hm(u);
  if (u - Date.now() < 2 * D) return 'until tomorrow ' + hm(u);
  return 'until ' + day(u);
}
const ind = (b) => `<i class="ind ${b ? (b.until === null ? 'forever' : 'timed') : ''}"></i>`;
const plus = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>';
const cross = '<svg width="8" height="8" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.6"><path d="M2 2l6 6M8 2l-6 6"/></svg>';
const icon = (url) => 'chrome://favicon2/?size=32&scaleFactor=2x&showFallbackMonogram=&pageUrl=' + encodeURIComponent(url);

function renderApps() {
  const apps = document.getElementById('apps');
  const sites = state.desktop.map((s, i) => `
    <a class="app" href="${esc(s.url)}" draggable="true" data-id="${esc(s.id)}" data-index="${i}">
      <span class="tile"><img src="${esc(icon(s.url))}" alt=""></span>
      <span class="label">${esc(s.title || new URL(s.url).hostname)}</span>
      <button class="rm" data-rm="${esc(s.id)}" aria-label="Remove ${esc(s.title)}">${cross}</button>
    </a>`).join('');
  apps.innerHTML = sites + `
    <button class="app add" id="add" aria-label="Add site">
      <span class="tile">${plus}</span><span class="label">Add site</span>
    </button>` + (state.desktopReady && !state.desktop.length
      ? '<p class="hint">Save a site here with ☆ in the address bar.</p>' : '');
}

function renderWidgets() {
  const w = document.getElementById('widgets');
  // One widget for now: blocking (the clock was dropped in design C20).
  w.innerHTML = distractionWidget();
}

// When the first of the timed blocks ends (null: none running).
let timed = null;

// The dock: how long, Block and the blocklist's settings button, with one
// status line above while something timed is running. Block blocks the
// distraction set (picked in the blocklist; every category to begin with) and
// only ever says "Block". It blocks what's still open; a block already
// running isn't lengthened (no Extend for now). With nothing left open, the
// status line and the settings button stay.
function distractionWidget() {
  const sum = MastSet.summary(state);
  const running = MastSet.running(state);
  const rows = running.filter((r) => r.until !== null);
  timed = rows.length ? Math.min(...rows.map((r) => r.until)) : null;
  const gear = `<button class="gear" id="editList" aria-label="Edit blocklist" data-tip="Edit blocklist">${mastIcon('settings', 18)}</button>`;
  const status = statusView();
  if (!sum.open && running.length) {
    return `<div class="widget dist" aria-label="Distractions">${status}<div class="acts">${gear}</div></div>`;
  }
  return `<div class="widget dist" aria-label="Distractions">
    ${status}${status ? '<i class="sep"></i>' : ''}
    <div class="seg">${DUR.map(([id, label]) => `<button data-dur="${id}" class="${id === dur ? 'on' : ''}" aria-label="${id}">${label}</button>`).join('')}</div>
    <div class="acts"><i class="bal"></i><button class="primary" id="blockAll" ${sum.open ? '' : 'disabled'}>Block</button>${gear}</div>
  </div>`;
}

// "Blocked until 6:40 PM" and the countdown to it. Nothing to press: a
// longer block is the dock's Block, or the blocklist.
function statusView() {
  if (timed === null) return '';
  return `<div class="run" role="status">
    <div class="line"><i class="dot"></i><span class="nm">Blocked ${untilText(timed)}</span></div>
    <span class="left" data-until="${timed}">${leftText(timed)}</span></div>`;
}

// "5:47:12 left" under a day, "6 days, 23 h left" beyond.
function leftText(until) {
  const ms = Math.max(0, until - Date.now());
  const days = Math.floor(ms / D), h = Math.floor((ms % D) / 36e5);
  if (days) return `${days} ${days === 1 ? 'day' : 'days'}, ${h} h left`;
  const m = Math.floor((ms % 36e5) / 6e4), sec = Math.floor((ms % 6e4) / 1e3);
  return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')} left`;
}

function render() { renderApps(); renderWidgets(); }

function toast(text, undo) {
  clearInterval(toastTimer);
  const el = document.getElementById('toast');
  const started = Date.now();
  const paint = () => {
    const left = Math.ceil((10e3 - (Date.now() - started)) / 1e3);
    if (undo && left <= 0) { el.innerHTML = ''; clearInterval(toastTimer); return; }
    el.innerHTML = `<div class="toast ${undo ? '' : 'plain'}">${esc(text)}${undo ? `<button id="undo">Undo<span class="secs">${left}</span></button>` : ''}</div>`;
  };
  paint();
  toastTimer = setInterval(paint, 250);
  if (!undo) setTimeout(() => { clearInterval(toastTimer); el.innerHTML = ''; }, 2600);
}

// Customize: the wallpaper (a file in the profile folder, served by this
// page's own source) and the palette (the whole browser's, not only this page).
let wallpaper = {{WALLPAPER}};     // version; 0 is none
let wallTop = {{WALLPAPER_TOP}};   // how far the picture starts above this page
let czBusy = false;                // an upload is on its way
let tone = {{WALLPAPER_TONE}};     // "dark" or "light": what the picture is
// The picture is laid out like a desktop wallpaper: it covers the screen,
// centred, starting at the top of the window, so the tab row (which the
// browser paints from the same image, mast_wallpaper.cc) and this page show
// one continuous picture.
const wallImg = new Image();
const wallEl = document.getElementById("wall");
// Reveal the picture once it is decoded (no frame of half-drawn image): one
// frame in its hidden state, then it fades in.
function revealWall() {
  layoutWallpaper();
  wallImg.decode().catch(() => {}).then(() => wallEl.classList.add("shown"));
}
wallImg.onload = revealWall;
function layoutWallpaper() {
  const iw = wallImg.naturalWidth, ih = wallImg.naturalHeight;
  if (!wallpaper || !iw) return;
  // As tall as the screen from the picture's top (the browser does the same).
  const sw = screen.width, sh = screen.height + wallTop, k = Math.max(sw / iw, sh / ih);
  const w = iw * k, h = ih * k;
  const s = document.body.style;
  s.setProperty('--wall-size', `${w}px ${h}px`);
  s.setProperty('--wall-pos', `${(sw - w) / 2}px ${(sh - h) / 2 - wallTop}px`);
}
addEventListener('resize', layoutWallpaper);
function applyWallpaper(v) {
  v = Math.max(0, v || 0);
  wallpaper = v;
  document.body.classList.toggle('wall', v > 0);
  document.documentElement.classList.toggle('picture', v > 0);
  const url = `wallpaper-${v}.jpg`;
  if (v > 0 && wallImg.getAttribute("src") === url) return;
  wallEl.classList.remove("shown");
  if (v > 0) {
    document.body.style.setProperty('--wall', `url(${url})`);
    wallImg.src = url;
    if (wallImg.complete && wallImg.naturalWidth) revealWall();  // already decoded (a second call is harmless)
  } else {
    document.body.style.removeProperty('--wall');
  }
}
applyWallpaper(wallpaper);
function applyTone(t) {
  tone = t === "light" ? "light" : "dark";
  document.body.classList.toggle("light", tone === "light");
}
applyTone(tone);

// Dark or light, from the picture's average brightness (Rec. 601 luma of a
// 64 px thumbnail). The user can flip it in Customize.
function guessTone(bmp) {
  const c = document.createElement("canvas");
  c.width = 64; c.height = Math.max(1, Math.round(64 * bmp.height / bmp.width));
  const g = c.getContext("2d");
  g.drawImage(bmp, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let sum = 0;
  for (let i = 0; i < d.length; i += 4) sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  return sum / (d.length / 4) / 255 > 0.58 ? "light" : "dark";
}

function renderCustomize() {
  if (!state || !document.getElementById('czDialog').open) return;
  const t = state.theme || {};
  // Built-in pictures first (public-domain paintings), then none or your own.
  const presets = t.presets || [];
  const preset = wallpaper ? (t.preset || '') : '';
  const own = wallpaper && !preset;
  document.getElementById('czPresets').innerHTML = presets.map((p) =>
    `<button data-preset="${esc(p.id)}" class="${preset === p.id ? 'on' : ''}" aria-pressed="${preset === p.id}"><i style="background-image:url(preset-${esc(p.id)}.jpg)"></i>${esc(p.name)}</button>`).join('');
  document.getElementById('czBgs').innerHTML =
    `<button data-bg="none" class="${wallpaper ? '' : 'on'}" aria-pressed="${!wallpaper}">None</button>` +
    (own ? `<button data-bg="image" class="on" aria-pressed="true" aria-label="Your image" style="background-image:url(wallpaper-${wallpaper}.jpg)"></button>` : '') +
    `<button data-bg="upload" class="up" ${czBusy ? 'disabled' : ''}>${czBusy ? 'Saving…' : own ? 'Replace' : 'Upload your own'}</button>`;
  const shown = presets.find((p) => p.id === preset);
  // The painting's credit when one is picked; nothing otherwise.
  const credit = document.getElementById('czCredit');
  credit.textContent = shown ? shown.credit : '';
  credit.hidden = !shown;
  // Dark or Light only means something with a picture: it sets the text and
  // icons on it (tab row included) to light or dark.
  document.getElementById('czTone').innerHTML = !wallpaper ? '' : `<h4>Image</h4>
    <div class="tone">${[['dark', 'Dark'], ['light', 'Light']].map(([id, label]) =>
      `<button data-tone="${id}" class="${tone === id ? 'on' : ''}" aria-pressed="${tone === id}">${label}</button>`).join('')}</div>
    <p class="sub">Light makes text and icons dark, for bright pictures.</p>`;
  // What the tab row shows on websites. "Picture" needs one; without it the
  // row is the palette, as "Theme" (the pref stays, for when a picture comes).
  const bar = !wallpaper && t.tabBar === 'picture' ? 'theme' : (t.tabBar || 'site');
  const mini = (cls, b) => `<span class="mini ${cls}" style="--b:${b}"><span class="tb"><i></i><i></i><i></i></span><span class="pg"><i></i><i></i><i></i></span></span>`;
  const slices = `<span class="mini slices">${[['#f6f5f2', 'lt'], ['#16243a', ''], ['#1f3d2e', '']].map(([b, cls]) =>
    `<span class="sl ${cls}" style="--b:${b}"><span class="tb"><i></i><i></i></span><span class="pg"><i></i><i></i><i></i></span></span>`).join('')}</span>`;
  const bars = [
    ['picture', 'Your picture', mini('', wallpaper ? `url(wallpaper-${wallpaper}.jpg)` : 'linear-gradient(120deg,#5b4a3a,#2c2a33)'), !wallpaper],
    ['theme', 'Your color', mini('', 'var(--surface)'), false],
    ['site', 'Match site', slices, false]];
  const barText = {
    picture: 'Your picture runs behind the tabs on every site, like the new tab page.',
    theme: wallpaper ? 'Websites get a plain tab bar in your color. Your picture stays on the new tab page.'
      : 'Websites get a plain tab bar in your color. Your picture needs a background image.',
    site: "The tab bar takes each website's own color, so the site runs up to the top."};
  document.getElementById('czBar').innerHTML = `<h4>Tab bar on websites</h4>
    <div class="bars">${bars.map(([id, label, m, off]) =>
      `<button data-bar="${id}" class="${bar === id ? 'on' : ''}" aria-pressed="${bar === id}" ${off ? 'disabled' : ''}>${m}${label}</button>`).join('')}</div>
    <p class="sub">${barText[bar]}</p>`;
  document.getElementById('czSw').innerHTML = (state.palettes || []).map((p) => `
    <button data-palette="${esc(p.id)}" class="${p.id === t.palette ? 'on' : ''}" aria-pressed="${p.id === t.palette}">
      <i style="background:linear-gradient(135deg, ${p.surface} 50%, ${p.field} 50%)"></i>${esc(p.name)}</button>`).join('');
}

// Large photos are scaled down here (2560 px on the long side, JPEG), so the
// browser stores and serves a few hundred KB instead of tens of MB.
async function uploadWallpaper(file) {
  czBusy = true;
  renderCustomize();
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const url = canvas.toDataURL('image/jpeg', 0.86);
    chrome.send('setWallpaper', [url.slice(url.indexOf(',') + 1), guessTone(bmp)]);
  } catch (e) {
    czBusy = false;
    renderCustomize();
    toast('That image can’t be used. Try a JPEG or PNG.');
  }
}
// Closing the panel hands focus back to the button; no ring for that.
document.getElementById('czDialog').addEventListener('close', () => document.getElementById('customize').blur());
document.getElementById('czFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) uploadWallpaper(file);
});

// A block/undo from the dock is waiting: what Block was pressed for ("News",
// "10 categories", "everything"), true for undo.
let deskAsked = false;
window.mastState = (s) => {
  const first = !state;
  state = s;
  if (first) dur = s.lastDuration || 'today';
  mastPalette(s.theme);
  if (s.theme && s.theme.tone && s.theme.tone !== tone) applyTone(s.theme.tone);
  if (s.theme && s.theme.wallpaperTop && s.theme.wallpaperTop !== wallTop) { wallTop = s.theme.wallpaperTop; layoutWallpaper(); }
  if (s.theme && Math.max(0, s.theme.wallpaper) !== wallpaper) { czBusy = false; applyWallpaper(s.theme.wallpaper); }
  // The blocklist panel shows its own toasts for its own requests.
  const handled = MastBlocklist.update(s);
  const r = s.result || {};
  if (r.wallpaperFailed) { czBusy = false; toast('That image couldn’t be saved.'); }
  if (r.invalidSite) {
    document.getElementById('addErr').textContent = 'That doesn’t look like a web address.';
    return;
  }
  if (!handled && deskAsked && (r.undone || 'changed' in r)) {
    const asked = deskAsked;
    deskAsked = false;
    if (r.undone) toast('Undone.');
    else if (!r.changed) toast('Already blocked at least that long.');
    else toast(`Blocked ${asked === true ? 'distractions' : asked} ${untilText(r.until)}.`, true);
  }
  if (document.getElementById('addDialog').open && !r.invalidSite) document.getElementById('addDialog').close();
  render();
  renderCustomize();
};

// Typing anywhere on the page, with nothing on it focused, goes to the address
// bar, which takes the focus (MastTabBar): no need to click it first. Not
// while a dialog or a field here has the keys, and shortcuts stay shortcuts.
let lastTyped = 0;
function typesHere(e) {
  const t = e.target;
  return !document.querySelector('dialog[open]') && !(t instanceof HTMLInputElement) &&
    !(t instanceof HTMLTextAreaElement) && !(t instanceof HTMLSelectElement) && !t.isContentEditable;
}
document.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  if ([...e.key].length !== 1 || !typesHere(e)) return;  // one printable character
  // A space only continues what's being typed (on its own it presses buttons).
  if (e.key === ' ' && Date.now() - lastTyped > 800) return;
  e.preventDefault();
  lastTyped = Date.now();
  chrome.send('typeInAddressBar', [e.key]);
});
document.addEventListener('paste', (e) => {
  const text = e.clipboardData && e.clipboardData.getData('text/plain').trim();
  if (!text || !typesHere(e)) return;
  e.preventDefault();
  chrome.send('typeInAddressBar', [text.slice(0, 2048)]);
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a');
  if (!t || !state) return;
  if (t.dataset.rm) {
    e.preventDefault();
    return chrome.send('desktopRemove', [t.dataset.rm]);
  }
  if (t.id === 'add') {
    document.getElementById('addErr').textContent = '';
    document.getElementById('addForm').reset();
    return document.getElementById('addDialog').showModal();
  }
  if (t.id === 'addCancel') return document.getElementById('addDialog').close();
  if (t.dataset.dur) { dur = t.dataset.dur; return renderWidgets(); }
  if (t.id === 'blockAll') {
    const sum = MastSet.summary(state);
    if (!sum.open) return;
    const go = () => { deskAsked = sum.what; chrome.send('blockDistractions', [dur]); };
    // Forever asks first (design C27b, mastConfirmForever in blocklist.html).
    return dur === 'forever' ? mastConfirmForever(sum.asked, go) : go();
  }
  if (t.id === 'undo') {
    clearInterval(toastTimer);
    document.getElementById('toast').innerHTML = '';
    deskAsked = true;
    return chrome.send('undo');
  }
  if (t.id === 'editList') {
    MastBlocklist.mount(document.getElementById('blRoot'));
    MastBlocklist.update(state);
    MastBlocklist.reset();
    return document.getElementById('blocklistDialog').showModal();
  }
  if (t.id === 'blClose') return document.getElementById('blocklistDialog').close();
  if (t.id === 'customize') { document.getElementById('czDialog').showModal(); return renderCustomize(); }
  if (t.id === 'czClose') return document.getElementById('czDialog').close();
  if (t.dataset.preset) return chrome.send('setWallpaperPreset', [t.dataset.preset]);
  if (t.dataset.bg === 'none') return wallpaper && chrome.send('clearWallpaper');
  if (t.dataset.bg === 'upload') return document.getElementById('czFile').click();
  if (t.dataset.palette) return chrome.send('setPalette', [t.dataset.palette]);
  if (t.dataset.bar) { state.theme.tabBar = t.dataset.bar; renderCustomize(); return chrome.send('setTabBar', [t.dataset.bar]); }
  if (t.dataset.tone) { applyTone(t.dataset.tone); renderCustomize(); return chrome.send('setWallpaperTone', [t.dataset.tone]); }
});
document.getElementById('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const url = document.getElementById('addUrl').value.trim();
  if (url) chrome.send('desktopAdd', [url, document.getElementById('addName').value.trim()]);
});

// Drag a site to reorder the desktop.
const apps = document.getElementById('apps');
const clearDrop = () => apps.querySelectorAll('.drop-before').forEach((n) => n.classList.remove('drop-before'));
apps.addEventListener('dragstart', (e) => {
  const a = e.target.closest('.app[data-id]');
  if (!a) return;
  dragId = a.dataset.id;
  a.classList.add('dragging');
  apps.classList.add('drag');  // no name pills while dragging
  e.dataTransfer.effectAllowed = 'move';
});
apps.addEventListener('dragend', (e) => { dragId = null; clearDrop(); apps.classList.remove('drag'); e.target.closest('.app')?.classList.remove('dragging'); });
apps.addEventListener('dragover', (e) => {
  if (!dragId) return;
  e.preventDefault();
  clearDrop();
  e.target.closest('.app')?.classList.add('drop-before');
});
apps.addEventListener('drop', (e) => {
  if (!dragId) return;
  e.preventDefault();
  const target = e.target.closest('.app');
  const from = state.desktop.findIndex((s) => s.id === dragId);
  let to = state.desktop.length - 1;  // dropped on "Add site" or empty space: last
  if (target && target.dataset.index !== undefined) {
    to = Number(target.dataset.index);
    if (to > from) to -= 1;  // dropped before a later icon: lands just ahead of it
  }
  clearDrop();
  if (from >= 0 && to !== from) chrome.send('desktopMove', [dragId, to]);
});

// The countdowns tick every second; when a block ends the page asks for fresh
// state (its row goes, and Block counts it again). State also refreshes when
// the tab comes back.
setInterval(() => {
  let ended = false;
  for (const el of document.querySelectorAll('.run [data-until]')) {
    const until = Number(el.dataset.until);
    if (Date.now() >= until) ended = true;
    else el.textContent = leftText(until);
  }
  if (ended) chrome.send('getState');
}, 1e3);
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && chrome.send('getState'));
chrome.send('getState');
</script>
</body>
</html>
